<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- FENZO Aluminium Logo SVG -->
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="40%" style="stop-color:#888888"/>
      <stop offset="60%" style="stop-color:#c8c8c8"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
  </defs>
  <!-- FZ monogram mark -->
  <rect x="4" y="4" width="52" height="72" rx="2" fill="none" stroke="url(#metalGrad)" stroke-width="2"/>
  <text x="30" y="52" font-family="serif" font-size="36" font-weight="700" fill="url(#metalGrad)" text-anchor="middle">FZ</text>
  <!-- FENZO wordmark -->
  <text x="68" y="42" font-family="serif" font-size="28" font-weight="300" fill="url(#metalGrad)" letter-spacing="4">FENZO</text>
  <text x="68" y="60" font-family="sans-serif" font-size="9" font-weight="400" fill="#888" letter-spacing="3">ALUMINIUM</text>
</svg>
